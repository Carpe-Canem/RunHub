      <polyline points="-6,-30 50,-8 38,52 62,56" stroke-width="22"/>
      <polyline points="14,-104 50,-84 84,-78" stroke-width="16"/>
      <polygon points="10,-158 34,-172 54,-152 44,-128 18,-130" fill="#0A0E18" stroke="none"/>
    </g>
    <!-- Leash: front hand to the harness ring -->
    <path d="M281.8 212.9 Q326 290 391.8 316.3" stroke="#0A0E18" stroke-width="9"/>
    <!-- Ziggy -->
    <g transform="translate(372 346) scale(.9)" stroke="#0A0E18">
