<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Run Hub: a runner and Ziggy, out on a leash. Full-bleed so the home screen's own mask rounds the corners. -->
  <rect width="512" height="512" fill="#FFB52E"/>
  <g transform="translate(256 256) scale(.96) translate(-259 -250)" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Runner -->
    <g transform="translate(160 326) scale(1.45)" stroke="#0A0E18">
      <polyline points="8,-100 -34,-84 -52,-54" stroke-width="16"/>
      <polyline points="-6,-30 -34,22 -88,10" stroke-width="22"/>
