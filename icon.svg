          <polyline points="-41.6,52.7 -56,70"/>
          <polyline points="72.5,46.9 90,60"/>
          <polyline points="17.8,52.7 4,68"/>
        </g>
      </g>
      <polygon points="-58,-24 40,-30 64,-8 48,24 -8,8 -50,16 -68,-4" fill="#0A0E18" stroke="none"/>
      <polygon points="54,-15 64,-8 48,24 40,21.7 47,8" fill="#FFFFFF" stroke="none"/>
      <g stroke="#2E9BC6">
        <polyline points="22,-30 26,17" stroke-width="10"/>
